name: Deploy Monitoring & Proxy
on:
  push:
    branches: ["dev"]
    paths:
      - 'docker-compose.monitoring.yml'
      - 'monitoring/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy Monitoring Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.monitoring.yml,monitoring/**"
          target: "${{ secrets.DEPLOY_PATH }}/monitoring"

      - name: Start Monitoring Stack
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}/monitoring
            
            # Stop old monitoring containers
            docker-compose -f docker-compose.monitoring.yml down
            
            # Start fresh monitoring stack
            docker-compose -f docker-compose.monitoring.yml up -d
            
            echo "Monitoring stack deployed"
