name: Reusable Deploy Template
on:
  workflow_call:
    inputs:
      service_folder:
        required: true
        type: string
      image_name:
        required: true
        type: string
      compose_service:
        required: true
        type: string
      env_image_var:
        required: true
        type: string
    secrets:
      SSH_HOST: { required: true }
      SSH_USER: { required: true }
      SSH_KEY: { required: true }
      DEPLOY_PATH: { required: true }
      GHCR_TOKEN: { required: true }
      GHCR_USERNAME: { required: true }

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: image
        run: |
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="ghcr.io/${OWNER_LOWER}/${{ inputs.image_name }}:sha-${GITHUB_SHA::7}"
          echo "image_ref=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service_folder }}
          file: ./${{ inputs.service_folder }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.services.yml"
          target: "${{ secrets.DEPLOY_PATH }}/app"

      - name: Server SSH Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          FINAL_PATH: "${{ secrets.DEPLOY_PATH }}/app"
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_USER: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE,FINAL_PATH,GH_TOKEN,GH_USER
          script: |
            set -eu
            cd "$FINAL_PATH"

            # Дописываем актуальный тег образа в общий .env
            sed -i '/^${{ inputs.env_image_var }}=/d' .env
            echo "${{ inputs.env_image_var }}=$IMAGE" >> .env

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

            # Подтягиваем новый образ и перезапускаем ТОЛЬКО нужный сервис
            docker compose -f docker-compose.services.yml pull ${{ inputs.compose_service }}
            docker compose -f docker-compose.services.yml up -d --no-deps ${{ inputs.compose_service }}
